[package]
name = "whisper-flow"
version = "0.2.0"
edition = "2021"

[dependencies]
cpal = "0.15"
evdev = "0.12"
opus = "0.3"
ogg = "0.9"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "json", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
